# Document Processing Configuration
document_processing:
  supported_formats:
    - pdf
    - docx
    - jpg
    - jpeg
    - png
    - mp4
  ocr:
    language: eng
    config: --oem 3 --psm 6
  max_file_size_mb: 50

# FDA Compliance Configuration
fda_checker:
  api_endpoint: "https://api.fda.gov/drug"
  timeout_seconds: 30
  retry_attempts: 3

# Pattern Analysis Configuration
pattern_analysis:
  min_pattern_occurrence: 3
  confidence_threshold: 0.8
  max_patterns_per_category: 10
  categories:
    - language
    - tone
    - visual
    - claims

# Rule Generation Configuration
rule_generation:
  output_format: json
  include_test_methodology: true
  max_rules_per_category: 20

# Logging Configuration
logging:
  level: INFO
  file: logs/compliance_analyzer.log
  max_file_size_mb: 10
  backup_count: 5

# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  debug: false
  workers: 4
